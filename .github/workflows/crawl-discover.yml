name: Crawl discovery

# Walks a rotating subset of funder sites looking for open calls, and queues the
# URLs it finds into Supabase for the main scan to pick up. Runs once a day —
# separate from the main scan, which runs every 2 hours.

on:
  schedule:
    - cron: '30 4 * * 1-5' # 04:30 UTC, weekdays
  workflow_dispatch: {} # lets you trigger a crawl manually from the Actions tab

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run crawl discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/crawl_discover.py
