name: Gemini discovery

# Uses Gemini's Google Search grounding + url_context tools to find clean
# cooking / clean energy funding opportunities AND industry events, and
# extract structured fields from each. Opportunities go into `grants`
# (source_type='gemini'); events go into the separate `events` table.
#
# Starts at twice a week, same conservative cadence social-discover.yml
# started at — bump the cron below once a few real runs show how much this
# actually costs/finds.

on:
  schedule:
    - cron: '0 6 * * 2,5' # 06:00 UTC, Tuesdays and Fridays
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  gemini:
    runs-on: ubuntu-latest
    # A real run at the old 15-candidate cap (already using the url_context +
    # google_search combo) took about 3 minutes end to end — roughly 12s per
    # candidate including GEMINI_PACING_SECONDS. At today's per-run ceiling —
    # 4 fixed opportunity sources + 38 fixed event sources (config/sources.yaml)
    # + up to 15 discovered opportunities + 50 discovered events = up to 107
    # extraction calls, plus 2 discovery calls — that same rate projects to
    # ~22 minutes; 40 gives headroom for retries/slower fetches without
    # leaving the job free to run indefinitely. If real runs start timing out
    # here, that's the signal to trim MAX_EVENTS_PER_RUN (or the
    # event_sources list) back down rather than just raising this further.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests==2.32.3 google-genai==2.23.0 pyyaml==6.0.2

      - name: Run Gemini discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gemini_discover.py

      # Housekeeping after each run: delete events that ended over a week ago,
      # discard duplicate copies and conference-mill listings. No Gemini
      # calls, takes seconds. See scripts/cleanup_events.py.
      - name: Clean up events
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: scripts
        run: python cleanup_events.py --apply
