# BURN's longlist of funding & procurement sources (2026-10-02) — used by
# scripts/gemini_discover.py (the Tuesday/Friday "Gemini discovery" run).
#
# How it is used:
#   - sources: each page is read by Gemini, which saves only calls that are OPEN
#     FOR APPLICATIONS NOW (an RFP, call for proposals, tender, funding round or
#     application window you can submit to). Programme pages with no open call,
#     forthcoming rounds and closed calls are skipped.
#     There are too many pages to read on every run, so each run reads a
#     rotating batch: SOURCES_P1_PER_RUN priority-1 pages and SOURCES_OTHER_PER_RUN
#     priority-2/3 pages (set in gemini_discover.py, or with the environment
#     variables of the same names). Priority 1 comes round about every 3 weeks,
#     the rest about every 6 weeks.
#   - funders_to_watch + every source name: given to Gemini's broad search as
#     funders whose OPEN calls are worth looking for, including ones that are not
#     clean-cooking specific (energy, climate, innovation, manufacturing, jobs).
#
# Add, remove or re-prioritise freely; no code change needed.
# (The pasted list stopped at "AgriFI" — add the rest of it below.)
# LinkedIn's #callforproposals hashtag page is left out: Gemini cannot read
# LinkedIn, and LinkedIn is already covered by scripts/social_discover.py.

funders_to_watch:
  - "Solar Impulse Foundation"
  - "Ngwee Ngwee Fund"
  - "Development Innovation Ventures (DIV)"
  - "Fund for Innovation in Development (FID)"
  - "European Union programmes (Horizon Europe, Global Gateway, EU delegation calls, EIC, EIT)"
  - "UNIDO"
  - "UNCDF"
  - "GIZ (including develoPPP and EnDev)"
  - "NEFCO (Modern Cooking Facility for Africa, Beyond the Grid Fund for Africa)"
  - "TDB Group (Trade and Development Bank)"
  - "PIFORES"

