# AWARDS & PRIZES (added 2026-10-01) — used only by
# `python scripts/gemini_discover.py --awards` (.github/workflows/awards-discover.yml).
#
# award_sources: known award pages checked on EVERY awards run. Gemini reads
# each one, finds the CURRENT edition (searching if the page is out of date),
# and saves it only if entries are open — so a closed award costs one call and
# is skipped. Add or remove freely (title is just a label).
award_sources:
  - title: "SDG Innovation Award (Senate of Economy + UNIDO)"
    url: "https://sdg-innovation.com/en/"
  - title: "German SDG Award — application portal"
    url: "https://bewerbung.sdg-innovation.com/"
  - title: "Ashden Awards"
    url: "https://ashden.org/awards/"
  - title: "Energy Globe Award"
    url: "https://www.energyglobe.info/"
  - title: "Zayed Sustainability Prize"
    url: "https://zayedsustainabilityprize.com/"
  - title: "Keeling Curve Prize"
    url: "https://www.keelingcurveprize.org/"
  - title: "UN Global Climate Action Awards (UNFCCC)"
    url: "https://unfccc.int/climate-action/un-global-climate-action-awards"
  - title: "BloombergNEF Pioneers"
    url: "https://about.bnef.com/bnef-pioneers/"
  - title: "Energy Institute Awards"
    url: "https://www.energyinst.org/awards"
  - title: "MIT Solve — Global Challenges"
    url: "https://solve.mit.edu/challenges"

# award_themes: one Google-Search discovery call per theme, each returning up
# to MAX_AWARDS_PER_THEME candidates. Reword, add or remove themes to steer
# what the awards run looks for.
award_themes:
  - "Clean cooking, SDG 7 (affordable and clean energy), energy access and off-grid energy awards"
  - "Clean / renewable energy and energy transition awards and prizes"
  - "Climate action, carbon reduction, sustainability and ESG awards for companies"
  - "SDG, innovation and social-impact awards — social enterprise, inclusive business, poverty alleviation"
  - "Environment and conservation awards — forests and deforestation, clean air, nature"
  - "African business, manufacturing and industrialisation awards, and women in energy / climate leadership awards"
